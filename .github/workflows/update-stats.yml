name: Update profile stats

on:
  schedule:
    # Daily at 03:23 in America/Sao_Paulo (06:23 UTC).
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-stats.yml'

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: stats
          options: username=artYYDP&theme=transparent&show_icons=true&hide=contribs,prs
          path: images/stats/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Generate Amazing-SAS-JobExec card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: pin
          options: username=artYYDP&repo=Amazing-SAS-JobExec&theme=dark
          path: images/stats/amazing-sas-jobexec.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Generate Advanced-Filters-SAS-VA card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: pin
          options: username=artYYDP&repo=Advanced-Filters-SAS-VA&theme=dark
          path: images/stats/advanced-filters-sas-va.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Generate sas-viya-codes card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: pin
          options: username=artYYDP&repo=sas-viya-codes&theme=dark
          path: images/stats/sas-viya-codes.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Generate SAS-Geo card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: pin
          options: username=artYYDP&repo=SAS-Geo&theme=dark
          path: images/stats/sas-geo.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      # Publish only after all five cards have been generated successfully.
      - name: Commit updated cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/stats/*.svg
          if git diff --cached --quiet; then
            echo "Stats are unchanged."
            exit 0
          fi
          git commit -m "chore: update profile stats"
          git pull --rebase origin main
          git push origin HEAD:main
